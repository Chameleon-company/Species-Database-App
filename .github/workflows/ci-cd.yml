name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.12 to match backend/Dockerfile and the README. On 3.9 the install
      # cannot succeed at all, because requirements.txt pins click==8.3.1 and
      # that needs 3.10 or newer.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python security scan (Safety)
        run: |
          pip install safety
          safety check --file requirements.txt --output json || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate || true

      - name: Run Snyk security scan (if token available)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --org=fbd7b7eb-23e2-443e-bd4d-cc08b4a918aa --project-name=SPECIES-DATABASE-APP

      - name: Run TruffleHog for secrets scanning
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: master
          head: HEAD
          extra_args: --debug --only-verified

  validate-repo:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    needs: validate-repo
    runs-on: ubuntu-latest
    # Parked, deliberately. This job still points at /var/www/your-app and
    # restarts a pm2 process called your-app, both of which are the placeholder
    # values it was written with, and it needs DEPLOY_HOST, DEPLOY_USER and
    # DEPLOY_KEY to exist. Nobody has said where this deploys to.
    #
    # It has never run, so this is not a regression, and switching it on
    # blind would either fail every build or SSH somewhere nobody chose.
    # Whoever owns deployment should fill in the three secrets and the two
    # paths below, then change this to:
    #   if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/your-app
            git pull
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart your-app
