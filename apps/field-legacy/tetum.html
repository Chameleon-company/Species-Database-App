<!DOCTYPE html>
<html lang="tet">
  <head>
    <meta charset="UTF-8" />
    <title>Baze-dadus Espésie sira</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b5c37" />
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/filters.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/onlineBanner.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-top">
          <h1 class="header-title">Baze-dadus Espésie sira</h1>
          <button class="lang-btn">TET</button>
        </div>

        <div class="search-bar">
          <span class="search-icon">
            <img src="./Assets/icons/search.svg" alt="Buka" />
          </span>
          <input type="text" placeholder="Buka espésie sira" id="searchInput" />
        </div>
      </header>

      <!-- Filter Carousel -->
      <div class="filter-carousel-container">
        <div class="filter-carousel" id="filter-carousel">
          <button class="filter-button" data-filter="all">Hamoos</button>
          <button class="filter-button" data-filter="a-z">A-Z</button>
          <button class="filter-button" data-filter="leaf-type">
            Tipu ai-tahan
          </button>
          <button class="filter-button" data-filter="fruit-type">
            Tipu ai-fuan
          </button>
        </div>
      </div>

      <div class="container" id="species-list"></div>

      <script src="scripts/config.js"></script>
      <script src="scripts/db.js"></script>
      <script src="scripts/dataService.js"></script>
      <script src="scripts/sync.js"></script>
      <script src="scripts/imageCache.js"></script>
      <script src="scripts/videoCache.js"></script>
      <script src="scripts/specieslist.js"></script>
      <script src="scripts/filterCarousel.js"></script>
      <script src="scripts/detectOnline.js" defer></script>
      <script src="scripts/sw-register.js"></script>

      <a class="back-link" href="index.html"></a>

      <div class="debug" id="debugInfo"></div>
    </main>

          <!-- LANGUAGE OVERLAY -->
      <div class="lang-overlay" id="langOverlay">
        <div
          class="lang-modal"
          role="dialog"
          aria-modal="true"
          aria-label="Hili lian"
        >
          <button class="close-overlay" id="closeOverlay" aria-label="Taka">
            ✖
          </button>

          <div class="lang-title">Ita hili ona</div>

          <div class="selected-pill" id="selectedPill">
            <div class="flag" id="selectedFlag" aria-hidden="true">🇹🇱</div>
            <div class="selected-name" id="selectedName">TETUM</div>
            <div class="check-dot" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M9.2 16.6 4.9 12.3l1.4-1.4 2.9 2.9 8-8 1.4 1.4-9.4 9.4z"
                />
              </svg>
            </div>
          </div>

          <div class="lang-title" style="margin-top: 18px">Lian hotu-hotu</div>

          <section class="card" aria-label="Lista lian">
            <div
              class="list"
              id="langList"
              role="listbox"
              aria-label="Lian sira"
            >
              <div
                class="row"
                role="option"
                aria-selected="true"
                data-code="EN"
                data-name="ENGLISH AU"
                data-flag="🇦🇺"
              >
                <div class="flag" aria-hidden="true">🇦🇺</div>
                <div class="name">ENGLISH AU</div>
                <div class="radio" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M9.2 16.6 4.9 12.3l1.4-1.4 2.9 2.9 8-8 1.4 1.4-9.4 9.4z"
                    />
                  </svg>
                </div>
              </div>

              <div
                class="row selected"
                role="option"
                aria-selected="false"
                data-code="TET"
                data-name="Tetum"
                data-flag="🇹🇱"
              >
                <div class="flag" aria-hidden="true">🇹🇱</div>
                <div class="name">TETUM</div>
                <div class="radio" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M9.2 16.6 4.9 12.3l1.4-1.4 2.9 2.9 8-8 1.4 1.4-9.4 9.4z"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </section>

          <!-- Privacy policy and sign out (opens in the system browser, like the login footer) -->
          <div class="menu-links">
            <a
              class="menu-link"
              href="https://species-database-api.onrender.com/privacy"
              target="_blank"
              rel="noopener noreferrer"
            >Polítika Privasidade</a>
            <button type="button" class="menu-link" id="signOutBtn">Sai</button>
          </div>
        </div>
      </div>
      <!-- FILTER OVERLAY (MATCHES HOME.HTML NOW) -->
      <div class="filter-overlay" id="filterOverlay">
        <div class="filter-modal">
          <button class="close-filter-overlay" id="closeFilterOverlay">
            ✖
          </button>
          <h2 id="filterTitle"></h2>
          <p id="filterDescription"></p>
          <div id="filterOptions"></div>
        </div>
      </div>

    <script>
      const PAGE_LANGUAGE = "tet";

      //Message in the species list while nothing is stored yet (first launch).
      //Tetum text only from reviewed strings in packages/i18n/messages/tet.json
      //(loading, failedToLoadSpecies, errorNetwork, retry).
      function renderListState(kind) {
        const list = document.getElementById("species-list")
        if (!list || (window.loadedSpeciesData || []).length > 0) return

        if (kind === "loading") {
          list.innerHTML = `
            <div style="text-align:center; padding:2rem; color:#475569;" role="status">
              <p style="font-size:1.1rem; font-weight:600;">Karreka...</p>
            </div>`
          return
        }

        list.innerHTML = `
          <div style="text-align:center; padding:2rem; color:#475569;" role="alert">
            <p style="font-size:1.1rem; font-weight:600;">La konsege karrega espésie</p>
            <p style="font-size:0.9rem;">La bele kontaktu servidor. Verifika ita-boot nia koneksaun no tenta fali.</p>
            <button type="button" id="listRetryBtn" style="margin-top:0.5rem; background:#0B5C37; color:#fff; border:none; padding:0.6rem 1.2rem; border-radius:10px; font-size:0.95rem; cursor:pointer;">Tenta Fali</button>
          </div>`
        document.getElementById("listRetryBtn").addEventListener("click", () => startupSync())
      }

      //Background sync. The list is drawn as soon as the species are stored; images follow in the
      //background. A failed request (not navigator.onLine, which can be wrong in the Android
      //WebView) decides that we are offline.
      async function startupSync() {
        if (!window.syncManager) return
        const hasSpecies = () => (window.loadedSpeciesData || []).length > 0
        renderListState("loading")
        try {
          const res = await syncManager.checkAndSync({forceBundle: false})
          if (res?.reason === "offline") throw new Error("Device is offline")
          if (res?.reason === "already_syncing") return //the running sync refreshes the list
          if (res?.synced || !hasSpecies()) window.setSpeciesData(await dataService.getAllSpecies(PAGE_LANGUAGE))
          if (!hasSpecies()) throw new Error("No species downloaded")
          console.log("TET background sync complete")
        }
        catch(err)
        {
          console.warn("Tet background sync skipped....", err)
          renderListState("error")
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        try {
          console.log("[Tetum] Starting sync...")

          //always load from indexedDB first
          const species =await dataService.getAllSpecies(PAGE_LANGUAGE)
          console.log("TET loaded from iDB", species.length)

          window.setSpeciesData(species)
        }
        catch(err)
        {
          console.error("TET fatal load error:", err)

          //absolute fallback
          window.setSpeciesData([])
        }

        //backgroudn sync if online; with nothing stored and no connection, explain and offer Retry
        if(navigator.onLine && window.syncManager) startupSync()
        else renderListState("error")
      });

      // LANGUAGE HANDLER
      const langBtn = document.querySelector(".lang-btn");
      const overlay = document.getElementById("langOverlay");
      const closeBtn = document.getElementById("closeOverlay");
      const selectedNameEl = document.getElementById("selectedName");
      const selectedFlagEl = document.getElementById("selectedFlag");
      langBtn.addEventListener("click", () => {
        overlay.style.display = "flex";
      });
      closeBtn.addEventListener("click", () => {
        overlay.style.display = "none";
      });
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) overlay.style.display = "none";
      });
      document.querySelectorAll("#langList .row").forEach((row) => {
        row.addEventListener("click", () => {
          document.querySelectorAll("#langList .row").forEach((r) => {
            r.classList.remove("selected");
            r.setAttribute("aria-selected", "false");
          });
          row.classList.add("selected");
          row.setAttribute("aria-selected", "true");
          selectedNameEl.textContent = row.dataset.name;
          selectedFlagEl.textContent = row.dataset.flag;
          langBtn.textContent = row.dataset.code;
          overlay.style.display = "none";
          //remember the choice so the next launch opens in this language
          localStorage.setItem("appLanguage", row.dataset.code === "TET" ? "tet" : "en");
          if (row.dataset.code === "TET") {
            window.location.replace("tetum.html");
          } else {
            window.location.replace("home.html");
          }
        });
      });

      // Sign out: forget the account and the guest choice, back to the login page
      const signOutBtn = document.getElementById("signOutBtn");
      signOutBtn.addEventListener("click", () => {
        ["user_id", "role", "admin_token", "guest"].forEach((key) => localStorage.removeItem(key));
        window.location.replace("login_tetum.html");
      });

      // ------------------------------
      // FILTER OVERLAY JS (NEW) PLEASE NOTE: TETUM TRANSLATION IS NEEDED, ENGLISH PLACEHOLDER USED
      // ------------------------------
      const filterOverlay = document.getElementById("filterOverlay");
      const closeFilterOverlay = document.getElementById("closeFilterOverlay");
      const filterTitle = document.getElementById("filterTitle");
      const filterOptions = document.getElementById("filterOptions");
      const filterDescription = document.getElementById("filterDescription");

      // Global state for active filters
      let activeFilters = {
        leafType: null,
        fruitType: null,
        sortDirection: null,
      };

      // Leaf/fruit type options are built from the loaded Tetum species each time the overlay
      // opens (getFilterOptions in specieslist.js), so every stored value can be chosen.
      // Option values are normalised keys; applyFilters compares species on the same key.
      const filterConfigs = {
        "a-z": {
          title: "Klasifika tuir alfabetu",
          description: "Klasifika espésie sira tuir orden sa'e ka tun.",
          options: [
            { label: "A → Z", action: () => sortSpecies("az") },
            { label: "Z → A", action: () => sortSpecies("za") },
          ],
        },
        "leaf-type": {
          title: "Tipu ai-tahan",
          description: "",
          options: () => getFilterOptions("leaf_type"),
        },
        "fruit-type": {
          title: "Tipu ai-fuan",
          description: "",
          options: () => getFilterOptions("fruit_type"),
        },
      };

      // Function to apply all active filters and search
      function applyFilters() {
        if (!window.loadedSpeciesData || window.loadedSpeciesData.length === 0){
          console.warn("No species data loaded yet");
          return;
        }

        let filtered = [...window.loadedSpeciesData];

        // Apply leaf type filter (case, spacing and apostrophes ignored)
        if (activeFilters.leafType) {
          filtered = filtered.filter(
            (species) =>
              normalizeFilterValue(species.leaf_type) === activeFilters.leafType
          );
        }

        // Apply fruit type filter
        if (activeFilters.fruitType) {
          filtered = filtered.filter(
            (species) =>
              normalizeFilterValue(species.fruit_type) === activeFilters.fruitType
          );
        }

        // Apply search filter
        const searchInput = document.getElementById("searchInput");
if (searchInput && searchInput.value.trim() !== "") {
  const query = searchInput.value.toLowerCase().trim();
  filtered = filtered.filter((species) => {
    const searchableFields = [
      species.scientific_name,
      species.common_name,
      species.habitat,
      species.identification_character,
      species.leaf_type,
      species.fruit_type,
    ];
    return searchableFields.some((field) =>
      String(field || "").toLowerCase().includes(query)
    );
  });
}
// Apply alphabetical sorting after search and filters
if (activeFilters.sortDirection) {
  filtered.sort((a, b) => {
    const nameA = String(a.scientific_name || "").toLowerCase();
    const nameB = String(b.scientific_name || "").toLowerCase();

    return activeFilters.sortDirection === "az"
      ? nameA.localeCompare(nameB)
      : nameB.localeCompare(nameA);
  });
}
// Render results or show no results message
if (filtered.length === 0 && typeof renderNoResults === "function") {
  renderNoResults();
} else {
  renderSpecies(filtered);
}
}
     // Make applyFilters available globally
      window.applyFilters = applyFilters;

      // Function to update filter button active states
      function updateFilterButtonStates() {
        const leafTypeBtn = document.querySelector('[data-filter="leaf-type"]');
        const fruitTypeBtn = document.querySelector(
          '[data-filter="fruit-type"]'
        );

        if (leafTypeBtn) {
          if (activeFilters.leafType) {
            leafTypeBtn.classList.add("active");
          } else {
            leafTypeBtn.classList.remove("active");
          }
        }

        if (fruitTypeBtn) {
          if (activeFilters.fruitType) {
            fruitTypeBtn.classList.add("active");
          } else {
            fruitTypeBtn.classList.remove("active");
          }
        }
      }

      // Function to create option buttons with active state
      function createOptionButton(option, filterType) {
        const optionBtn = document.createElement("button");
        optionBtn.className = "placeholder-option";
        const optionValue = option.value || option;
        optionBtn.textContent = option.label || option;

        // Check if this option is currently active
        const isActive =
          (filterType === "leaf-type" &&
            activeFilters.leafType === optionValue) ||
          (filterType === "fruit-type" &&
            activeFilters.fruitType === optionValue);

        if (isActive) {
          optionBtn.style.background = "#0f172a";
          optionBtn.style.color = "#ffffff";
        }

        optionBtn.onclick = () => {
          if (filterType === "leaf-type") {
            // Toggle leaf type filter
            if (activeFilters.leafType === optionValue) {
              activeFilters.leafType = null; // Deselect if already selected
            } else {
              activeFilters.leafType = optionValue; // Select new option
            }
          } else if (filterType === "fruit-type") {
            // Toggle fruit type filter
            if (activeFilters.fruitType === optionValue) {
              activeFilters.fruitType = null; // Deselect if already selected
            } else {
              activeFilters.fruitType = optionValue; // Select new option
            }
          }

          // Update filter button states
          updateFilterButtonStates();

          // Apply filters
          applyFilters();

          // Close overlay
          filterOverlay.style.display = "none";
        };

        return optionBtn;
      }

      document.querySelectorAll(".filter-button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.filter;

          if (key === "all") {
            // Clear all filters
            activeFilters.leafType = null;
            activeFilters.fruitType = null;
            activeFilters.sortDirection = null;

            // Remove active state from all filter buttons except "all"
            document.querySelectorAll(".filter-button").forEach((b) => {
              if (b.dataset.filter !== "all") {
                b.classList.remove("active");
              }
            });
            btn.classList.add("active");

            // Reset search input
            const searchInput = document.getElementById("searchInput");
            if (searchInput) {
              searchInput.value = "";
            }

            // Render all species - check if data is loaded
            if (window.loadedSpeciesData && window.loadedSpeciesData.length > 0) {
              renderSpecies(window.loadedSpeciesData);
            } else {
              console.warn("Species data not loaded yet");
            }
            
            // Don't show overlay for "All" button
            return;
          }

          // Don't remove active state for leaf-type and fruit-type buttons
          // They can be active simultaneously
          // A-Z is a sort, not a filter, so it can work alongside filters
          if (key === "a-z") {
            // A-Z can be active alongside leaf-type and fruit-type
            btn.classList.add("active");
          } else if (key !== "leaf-type" && key !== "fruit-type") {
            document.querySelectorAll(".filter-button").forEach((b) => {
              if (
                b.dataset.filter !== "leaf-type" &&
                b.dataset.filter !== "fruit-type" &&
                b.dataset.filter !== "a-z"
              ) {
                b.classList.remove("active");
              }
            });
            btn.classList.add("active");
          }

          const config = filterConfigs[key];
          if (!config) return;

          filterTitle.textContent = config.title;
          filterDescription.textContent = config.description;
          filterOptions.innerHTML = "";

          const options = typeof config.options === "function" ? config.options() : config.options;
          options.forEach((option) => {
            let optionBtn;

            if (option.action) {
              // For A-Z filter with actions
              optionBtn = document.createElement("button");
              optionBtn.className = "placeholder-option";
              optionBtn.textContent = option.label;
              optionBtn.onclick = () => {
                if (option.action) {
                  option.action();
                }
                filterOverlay.style.display = "none";
              };
            } else {
              // For leaf-type and fruit-type filters
              optionBtn = createOptionButton(option, key);
            }

            filterOptions.appendChild(optionBtn);
          });

          filterOverlay.style.display = "flex";
        });
      });

      closeFilterOverlay.addEventListener("click", () => {
        filterOverlay.style.display = "none";
      });

      // Initialize: Set "All" button as active by default when page loads
      document.addEventListener("DOMContentLoaded", () => {
        const allButton = document.querySelector('[data-filter="all"]');
        if (allButton) {
          allButton.classList.add("active");
        }
      });

      let originalOrder = null;

      document.addEventListener("DOMContentLoaded", () => {
        originalOrder = Array.from(document.querySelectorAll(".species-item"));
      });

      function resetSpeciesList() {
        const list = document.getElementById("species-list");
        if (!originalOrder) return;
        originalOrder.forEach((item) => list.appendChild(item));
      }

      function sortSpecies(direction) {
        activeFilters.sortDirection = direction;
        applyFilters();
      }
    </script>
  </body>
</html>
