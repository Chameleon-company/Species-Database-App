name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "ml/training/**"
      - "services/flask-api/**"
      - ".github/workflows/ai-backend-tests.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "ml/training/**"
      - "services/flask-api/**"
      - ".github/workflows/ai-backend-tests.yml"

jobs:
  test-ai-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/flask-api/requirements.txt
            services/flask-api/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/flask-api/requirements.txt
          python -m pip install -r services/flask-api/requirements-test.txt

      - name: Compile AI backend modules
        run: |
          python -m py_compile \
            services/flask-api/app.py \
            services/flask-api/ai_routes.py \
            services/flask-api/ai_service.py \
            services/flask-api/tests/evaluate_ai_model.py

      - name: Run AI backend tests
        working-directory: services/flask-api
        run: python -m pytest tests -v

  migration-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run migration harness
        run: bash services/flask-api/migrations/test_migration.sh
